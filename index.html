<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>回到照片里，再看一次</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./libs/three.module.js",
        "@sparkjsdev/spark": "./libs/spark.module.js"
      }
    }
  </script>
  <style>
    :root {
      --bg: #070709;
      --surface: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f3efe6;
      --text-muted: rgba(243, 239, 230, 0.62);
      --accent: #e8c78e;
      --danger: #ff4d4f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* 首屏 */
    #landing {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% 25%, rgba(232, 199, 142, 0.11), transparent 55%),
        radial-gradient(circle at 50% 85%, rgba(92, 110, 145, 0.09), transparent 60%),
        var(--bg);
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #landing.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .landing-inner {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1.title {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 5.5vw, 1.95rem);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 24px rgba(232, 199, 142, 0.18);
    }

    .subtitle {
      margin: 0 0 22px;
      font-size: 0.86rem;
      line-height: 1.6;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .scene-list-box {
      width: 100%;
      max-height: 40dvh;
      overflow-y: auto;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      margin-bottom: 16px;
      text-align: left;
    }

    .scene-list-header {
      font-size: 0.76rem;
      color: var(--text-muted);
      padding: 2px 6px 8px;
      letter-spacing: 0.04em;
    }

    .scene-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      touch-action: manipulation;
    }

    .scene-item:last-child {
      margin-bottom: 0;
    }

    .scene-item:active {
      transform: scale(0.98);
      background: rgba(232, 199, 142, 0.14);
      border-color: rgba(232, 199, 142, 0.4);
    }

    .scene-item-tag {
      font-size: 0.72rem;
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(232, 199, 142, 0.12);
      flex-shrink: 0;
    }

    .scene-empty {
      padding: 18px 10px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .btn-pick-file {
      width: 100%;
      height: 48px;
      border-radius: 999px;
      border: 1px solid rgba(232, 199, 142, 0.42);
      background: linear-gradient(135deg, rgba(232, 199, 142, 0.2), rgba(207, 165, 102, 0.12));
      color: var(--text);
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      touch-action: manipulation;
    }

    input[type="file"] {
      display: none;
    }

    /* 加载遮罩 */
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(7, 7, 9, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #loading-overlay.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .loader-ring {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(232, 199, 142, 0.2);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #loading-text {
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      color: var(--text);
    }

    /* WebGL 画布容器 */
    #scene-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      touch-action: none;
      background: var(--bg);
    }

    #scene-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 隐藏的摄像头视频源（仅作为 WebGL 纹理输入） */
    #ar-video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      z-index: -1;
    }

    /* 沉浸 HUD */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #hud.visible {
      opacity: 1;
      visibility: visible;
    }

    .hud-top {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .hud-top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-pill {
      pointer-events: auto;
      padding: 7px 13px;
      border-radius: 999px;
      background: rgba(12, 12, 16, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: rgba(243, 239, 230, 0.92);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      touch-action: manipulation;
    }

    .hud-pill.active {
      border-color: rgba(232, 199, 142, 0.55);
      background: rgba(232, 199, 142, 0.18);
      color: #fff6e6;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      display: inline-block;
    }

    .hud-pill.recording {
      border-color: rgba(255, 77, 79, 0.65);
      background: rgba(255, 77, 79, 0.2);
    }

    .hud-pill.recording .rec-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* 进入提示 */
    #enter-hint {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(10, 10, 14, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      font-size: 0.96rem;
      letter-spacing: 0.14em;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #enter-hint.visible {
      opacity: 1;
    }

    /* 终点文案 */
    #end-message {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 48px);
      max-width: 420px;
      text-align: center;
      color: rgba(247, 241, 230, 0.95);
      font-size: clamp(1rem, 4vw, 1.24rem);
      letter-spacing: 0.18em;
      line-height: 1.8;
      text-shadow: 0 2px 26px rgba(0, 0, 0, 0.8), 0 0 24px rgba(232, 199, 142, 0.35);
      opacity: 0;
      transition: opacity 1.3s ease;
    }

    #end-message.visible {
      opacity: 1;
    }

    /* 底部控制 */
    .hud-bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(18px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 16px;
    }

    #retreat-btn {
      pointer-events: auto;
      padding: 10px 22px;
      border-radius: 999px;
      background: rgba(16, 16, 22, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text);
      font-size: 0.84rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);
      transition: opacity 0.4s ease, visibility 0.4s ease, transform 0.4s ease;
      touch-action: manipulation;
    }

    #retreat-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #retreat-btn.active {
      background: rgba(232, 199, 142, 0.24);
      border-color: rgba(232, 199, 142, 0.5);
    }

    /* 录制完成弹窗 */
    #video-modal {
      position: fixed;
      inset: 0;
      z-index: 35;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(7, 7, 9, 0.84);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #video-modal.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .modal-card {
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #121216;
      padding: 16px;
      text-align: center;
    }

    .modal-card video {
      width: 100%;
      max-height: 46dvh;
      border-radius: 10px;
      background: #000;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-btn {
      flex: 1;
      height: 42px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.84rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .modal-btn.primary {
      background: linear-gradient(135deg, #ebd09e, #cfa566);
      color: #16120c;
      border-color: transparent;
      font-weight: 500;
    }

    /* Toast */
    #toast {
      position: fixed;
      left: 50%;
      top: calc(64px + env(safe-area-inset-top));
      transform: translate(-50%, -8px);
      z-index: 40;
      max-width: calc(100% - 32px);
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(20, 20, 26, 0.88);
      border: 1px solid rgba(232, 199, 142, 0.32);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text);
      font-size: 0.8rem;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    #toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>
</head>
<body>

  <!-- 首屏 -->
  <section id="landing">
    <div class="landing-inner">
      <h1 class="title">回到照片里，再看一次</h1>
      <p class="subtitle">选择一个高斯泼溅回忆场景，走进它，直到化作光尘</p>

      <div class="scene-list-box">
        <div class="scene-list-header">splats_mobile/ 中的回忆场景</div>
        <div id="scene-list">
          <div class="scene-empty">正在扫描 splats_mobile/ 目录…</div>
        </div>
      </div>

      <button type="button" class="btn-pick-file" id="pick-file-btn">从本地选择 .splat / .ply 文件</button>
      <input type="file" id="splat-file-input" accept=".splat,.ply,.spz,.ksplat" />
    </div>
  </section>

  <!-- 加载遮罩 -->
  <div id="loading-overlay">
    <div class="loader-ring"></div>
    <div id="loading-text">正在展开这段回忆…</div>
  </div>

  <!-- WebGL 渲染画布 -->
  <div id="scene-container"></div>
  <video id="ar-video" playsinline muted></video>

  <!-- 沉浸 HUD -->
  <div id="hud">
    <div class="hud-top">
      <button type="button" class="hud-pill" id="back-btn">返回列表</button>
      <div class="hud-top-right">
        <button type="button" class="hud-pill" id="ar-toggle-btn">AR 实景</button>
        <button type="button" class="hud-pill" id="rec-btn">
          <span class="rec-dot"></span>
          <span id="rec-label">录制</span>
        </button>
      </div>
    </div>

    <div id="enter-hint">按住屏幕，走近它</div>
    <div id="end-message"></div>

    <div class="hud-bottom">
      <button type="button" id="retreat-btn">长按回退</button>
    </div>
  </div>

  <!-- 录制完成预览与保存弹窗 -->
  <div id="video-modal">
    <div class="modal-card">
      <video id="recorded-preview" controls playsinline></video>
      <div class="modal-actions">
        <a class="modal-btn primary" id="download-video-btn" download="walk-into-memory.mp4">保存视频</a>
        <button type="button" class="modal-btn" id="share-video-btn" style="display:none;">分享 / 存相册</button>
        <button type="button" class="modal-btn" id="close-modal-btn">关闭</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script type="module">
    import * as THREE from 'three';
    import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';

    // =========================================================================
    // 可配置文案与核心参数（集中放在顶部，方便直接修改）
    // =========================================================================
    const CONFIG = {
      END_MESSAGE: '有些人，只能在回忆里再见了。',
      ENTER_HINT: '按住屏幕，走近它',
      ENTER_HINT_DURATION_MS: 3000,
      MAX_PIXEL_RATIO: 2,
      DUST_COUNT: 18000,           // 叠加的光尘粒子数
      WALK_FORWARD_SPEED: 0.42,    // 按住前进速度（进度/秒）
      WALK_RETREAT_SPEED: 0.62,    // 长按回退速度（进度/秒）
      END_MESSAGE_THRESHOLD: 0.85, // 走到最近处显示终点文案的阈值
      DEFAULT_START_Z: 0.0,        // SHARP 原始相机起点 Z
      DEFAULT_END_Z: -2.4          // 相机最深推进 Z（不穿模到漆黑）
    };

    // =========================================================================
    // DOM 引用
    // =========================================================================
    const landingEl = document.getElementById('landing');
    const sceneListEl = document.getElementById('scene-list');
    const pickFileBtn = document.getElementById('pick-file-btn');
    const splatFileInput = document.getElementById('splat-file-input');

    const loadingOverlay = document.getElementById('loading-overlay');
    const loadingText = document.getElementById('loading-text');

    const sceneContainer = document.getElementById('scene-container');
    const arVideoEl = document.getElementById('ar-video');
    const hudEl = document.getElementById('hud');
    const backBtn = document.getElementById('back-btn');
    const arToggleBtn = document.getElementById('ar-toggle-btn');
    const recBtn = document.getElementById('rec-btn');
    const recLabel = document.getElementById('rec-label');

    const enterHintEl = document.getElementById('enter-hint');
    const endMessageEl = document.getElementById('end-message');
    const retreatBtn = document.getElementById('retreat-btn');

    const videoModal = document.getElementById('video-modal');
    const recordedPreview = document.getElementById('recorded-preview');
    const downloadVideoBtn = document.getElementById('download-video-btn');
    const shareVideoBtn = document.getElementById('share-video-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const toastEl = document.getElementById('toast');

    enterHintEl.textContent = CONFIG.ENTER_HINT;
    endMessageEl.textContent = CONFIG.END_MESSAGE;

    // =========================================================================
    // 状态管理
    // =========================================================================
    const state = {
      inScene: false,
      arMode: false,
      arStream: null,

      gyroGranted: false,
      gyroActive: false,
      gyroBaseQuat: null,

      targetYaw: 0,
      targetPitch: 0,
      currentYaw: 0,
      currentPitch: 0,

      isDragging: false,
      lastPointerX: 0,
      lastPointerY: 0,

      isHoldingForward: false,
      isHoldingRetreat: false,
      walkProgress: 0,
      smoothProgress: 0,

      startZ: CONFIG.DEFAULT_START_Z,
      endZ: CONFIG.DEFAULT_END_Z,
      sceneCenter: new THREE.Vector3(0, 0, -1.8),

      mediaRecorder: null,
      recordedChunks: [],
      isRecording: false,
      recStartTime: 0,
      recTimerId: null,
      lastVideoBlob: null,
      lastVideoUrl: null,
      lastVideoExt: 'mp4',

      hintTimer: null,
      toastTimer: null
    };

    function showToast(msg, duration = 3400) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        toastEl.classList.remove('visible');
      }, duration);
    }

    // =========================================================================
    // 扫描 splats_mobile/ 列表
    // =========================================================================
    async function loadMobileSplatList() {
      let files = [];
      try {
        const res = await fetch('./splats_mobile/manifest.json', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data.files)) files = data.files;
        }
      } catch {}

      // 兜底：尝试解析本地静态服务器（如 python http.server）目录列表
      if (files.length === 0) {
        try {
          const res = await fetch('./splats_mobile/', { cache: 'no-store' });
          if (res.ok) {
            const html = await res.text();
            const matches = [...html.matchAll(/href="([^"]+\.(?:splat|ply|spz|ksplat))"/gi)];
            files = [...new Set(matches.map(m => decodeURIComponent(m[1].split('/').pop())))];
          }
        } catch {}
      }

      if (files.length === 0) {
        sceneListEl.innerHTML = `<div class="scene-empty">暂未发现预设场景文件。<br>请把照片放进 <code>photos/</code> 并运行 <code>make_splat.bat</code>，或点击下方按钮选择本地文件。</div>`;
        return;
      }

      sceneListEl.innerHTML = '';
      for (const name of files) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'scene-item';
        btn.innerHTML = `<span>${name}</span><span class="scene-item-tag">进入回忆</span>`;
        btn.addEventListener('click', () => enterSceneWithSource({ url: `./splats_mobile/${encodeURIComponent(name)}`, name }));
        sceneListEl.appendChild(btn);
      }
    }
    loadMobileSplatList();

    pickFileBtn.addEventListener('click', () => {
      splatFileInput.value = '';
      splatFileInput.click();
    });

    splatFileInput.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const bytes = new Uint8Array(await file.arrayBuffer());
      await enterSceneWithSource({ fileBytes: bytes, name: file.name });
    });

    // =========================================================================
    // Three.js + Spark.js 场景与 AR 摄像头纹理合成
    // =========================================================================
    let renderer, scene, camera, spark, splatMesh, dustPoints, dustUniforms;
    let bgScene, bgCamera, bgMesh, bgUniforms, videoTexture;
    const clock = new THREE.Clock();
    let animFrameId = null;

    function initRendererAndScenes() {
      if (renderer) return;

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.MAX_PIXEL_RATIO));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x070709, 1);
      renderer.autoClear = false;
      sceneContainer.appendChild(renderer.domElement);

      // 主 3D 场景
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.02, 100);
      camera.position.set(0, 0, CONFIG.DEFAULT_START_Z);

      spark = new SparkRenderer({ renderer });
      scene.add(spark);

      // AR 实景背景场景（渲染进同一 WebGL 画布，保证 captureStream 同步录到实景）
      bgScene = new THREE.Scene();
      bgCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      videoTexture = new THREE.VideoTexture(arVideoEl);
      videoTexture.colorSpace = THREE.SRGBColorSpace;
      videoTexture.minFilter = THREE.LinearFilter;
      videoTexture.magFilter = THREE.LinearFilter;

      bgUniforms = {
        uTex: { value: videoTexture },
        uCanvasAspect: { value: window.innerWidth / window.innerHeight },
        uVideoAspect: { value: 16 / 9 }
      };

      const bgMat = new THREE.ShaderMaterial({
        uniforms: bgUniforms,
        depthTest: false,
        depthWrite: false,
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position.xy, 0.0, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uTex;
          uniform float uCanvasAspect;
          uniform float uVideoAspect;
          varying vec2 vUv;
          void main() {
            vec2 uv = vUv;
            // object-fit: cover 等比裁切，避免手机竖屏拉伸
            if (uCanvasAspect > uVideoAspect) {
              float scale = uVideoAspect / uCanvasAspect;
              uv.y = (uv.y - 0.5) * scale + 0.5;
            } else {
              float scale = uCanvasAspect / uVideoAspect;
              uv.x = (uv.x - 0.5) * scale + 0.5;
            }
            gl_FragColor = texture2D(uTex, uv);
          }
        `
      });

      bgMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat);
      bgScene.add(bgMesh);

      window.addEventListener('resize', onResize);
    }

    function onResize() {
      if (!renderer || !camera) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CONFIG.MAX_PIXEL_RATIO));
      renderer.setSize(w, h);
      if (bgUniforms) bgUniforms.uCanvasAspect.value = w / h;
      if (dustUniforms) dustUniforms.uPixelRatio.value = Math.min(window.devicePixelRatio || 1, CONFIG.MAX_PIXEL_RATIO);
    }

    // 叠加向上飘散的光尘粒子层
    function buildLightDustLayer(center, radius) {
      if (dustPoints) {
        scene.remove(dustPoints);
        dustPoints.geometry.dispose();
        dustPoints.material.dispose();
      }

      const count = CONFIG.DUST_COUNT;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const randoms = new Float32Array(count * 3);

      const palette = [
        new THREE.Color(0xffe6b8),
        new THREE.Color(0xf7c98e),
        new THREE.Color(0xfff4de),
        new THREE.Color(0xd7c0a5)
      ];

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const r = Math.pow(Math.random(), 0.6) * radius;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);

        positions[i3] = center.x + r * Math.sin(phi) * Math.cos(theta) * 1.15;
        positions[i3 + 1] = center.y + r * Math.cos(phi) * 0.85;
        positions[i3 + 2] = center.z + r * Math.sin(phi) * Math.sin(theta);

        const c = palette[i % palette.length];
        colors[i3] = c.r;
        colors[i3 + 1] = c.g;
        colors[i3 + 2] = c.b;

        randoms[i3] = Math.random();
        randoms[i3 + 1] = Math.random();
        randoms[i3 + 2] = Math.random();
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geo.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));

      dustUniforms = {
        uTime: { value: 0 },
        uDissolve: { value: 0 },
        uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, CONFIG.MAX_PIXEL_RATIO) }
      };

      const mat = new THREE.ShaderMaterial({
        uniforms: dustUniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          attribute vec3 aColor;
          attribute vec3 aRandom;
          uniform float uTime;
          uniform float uDissolve;
          uniform float uPixelRatio;
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vColor = aColor;
            float d = pow(uDissolve, 1.15);
            vec3 pos = position;

            // 靠近时向上飘升并轻柔旋散
            float rise = (0.4 + aRandom.y * 1.5) * d;
            float swirl = uTime * (0.45 + aRandom.x * 0.5) + aRandom.z * 6.2831;
            pos.y += rise + mod(uTime * 0.08 * (0.5 + aRandom.x), 0.35) * d;
            pos.x += sin(swirl) * (0.04 + d * 0.45);
            pos.z += cos(swirl * 0.9) * (0.04 + d * 0.35);

            vec4 mv = modelViewMatrix * vec4(pos, 1.0);
            gl_Position = projectionMatrix * mv;
            float size = mix(2.0, 14.0, d) * (0.5 + aRandom.z * 0.9);
            gl_PointSize = size * uPixelRatio * (1.0 / max(0.35, -mv.z));

            // 越靠近光尘越明显，并在最深处保留柔和余烬感
            float appear = smoothstep(0.05, 0.45, uDissolve);
            float endSoft = 1.0 - smoothstep(0.88, 1.0, uDissolve) * 0.45;
            vAlpha = appear * endSoft * 0.78;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float soft = exp(-dist * dist * 11.0);
            gl_FragColor = vec4(vColor, soft * vAlpha);
          }
        `
      });

      dustPoints = new THREE.Points(geo, mat);
      scene.add(dustPoints);
    }

    // =========================================================================
    // 陀螺仪（魔窗）与拖动环视
    // =========================================================================
    const _euler = new THREE.Euler();
    const _qCurrent = new THREE.Quaternion();
    const _qScreen = new THREE.Quaternion();
    const _qWorldFix = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const _qRel = new THREE.Quaternion();
    const _relEuler = new THREE.Euler(0, 0, 0, 'YXZ');
    const _zAxis = new THREE.Vector3(0, 0, 1);

    function handleDeviceOrientation(event) {
      if (!state.inScene) return;
      if (event.alpha === null || event.beta === null || event.gamma === null) return;

      const alpha = THREE.MathUtils.degToRad(event.alpha);
      const beta = THREE.MathUtils.degToRad(event.beta);
      const gamma = THREE.MathUtils.degToRad(event.gamma);
      const orient = THREE.MathUtils.degToRad(window.orientation || 0);

      _euler.set(beta, alpha, -gamma, 'YXZ');
      _qCurrent.setFromEuler(_euler);
      _qCurrent.multiply(_qWorldFix);
      _qScreen.setFromAxisAngle(_zAxis, -orient);
      _qCurrent.multiply(_qScreen);

      if (!state.gyroBaseQuat) {
        state.gyroBaseQuat = _qCurrent.clone().invert();
        state.gyroActive = true;
        return;
      }

      _qRel.copy(state.gyroBaseQuat).multiply(_qCurrent);
      _relEuler.setFromQuaternion(_qRel, 'YXZ');

      state.targetYaw = THREE.MathUtils.clamp(_relEuler.y, -0.75, 0.75);
      state.targetPitch = THREE.MathUtils.clamp(_relEuler.x, -0.5, 0.5);
    }

    async function requestGyroSynchronously() {
      if (typeof DeviceOrientationEvent === 'undefined') {
        return false;
      }
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const res = await DeviceOrientationEvent.requestPermission();
          return res === 'granted';
        } catch {
          return false;
        }
      }
      return true;
    }

    function enableGyro() {
      state.gyroBaseQuat = null;
      state.gyroActive = false;
      window.addEventListener('deviceorientation', handleDeviceOrientation, true);
    }

    function disableGyro() {
      window.removeEventListener('deviceorientation', handleDeviceOrientation, true);
      state.gyroActive = false;
      state.gyroBaseQuat = null;
    }

    // =========================================================================
    // 交互：按住前进 / 拖动环视 / 长按回退
    // =========================================================================
    sceneContainer.addEventListener('pointerdown', (e) => {
      if (!state.inScene) return;
      state.isDragging = true;
      state.isHoldingForward = true;
      state.lastPointerX = e.clientX;
      state.lastPointerY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!state.inScene || !state.isDragging) return;
      const dx = e.clientX - state.lastPointerX;
      const dy = e.clientY - state.lastPointerY;
      state.lastPointerX = e.clientX;
      state.lastPointerY = e.clientY;

      if (!state.gyroActive) {
        state.targetYaw = THREE.MathUtils.clamp(state.targetYaw - dx * 0.0032, -0.75, 0.75);
        state.targetPitch = THREE.MathUtils.clamp(state.targetPitch - dy * 0.0032, -0.5, 0.5);
      }
    });

    const stopForward = () => {
      state.isDragging = false;
      state.isHoldingForward = false;
    };
    window.addEventListener('pointerup', stopForward);
    window.addEventListener('pointercancel', stopForward);

    retreatBtn.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      e.preventDefault();
      state.isHoldingRetreat = true;
      retreatBtn.classList.add('active');
    });
    const stopRetreat = () => {
      state.isHoldingRetreat = false;
      retreatBtn.classList.remove('active');
    };
    window.addEventListener('pointerup', stopRetreat);
    window.addEventListener('pointercancel', stopRetreat);

    window.addEventListener('keydown', (e) => {
      if (!state.inScene) return;
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') state.isHoldingForward = true;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') state.isHoldingRetreat = true;
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') state.isHoldingForward = false;
      if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') state.isHoldingRetreat = false;
    });

    // =========================================================================
    // AR 摄像头模式切换（必须在用户点击里触发 getUserMedia）
    // =========================================================================
    async function enableARMode() {
      if (!navigator.mediaDevices?.getUserMedia) {
        showToast('当前环境不支持摄像头调用，请在 Safari HTTPS 下打开');
        return false;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        state.arStream = stream;
        arVideoEl.srcObject = stream;
        await arVideoEl.play();
        if (arVideoEl.videoWidth > 0 && bgUniforms) {
          bgUniforms.uVideoAspect.value = arVideoEl.videoWidth / arVideoEl.videoHeight;
        }
        arVideoEl.addEventListener('loadedmetadata', () => {
          if (arVideoEl.videoWidth > 0 && bgUniforms) {
            bgUniforms.uVideoAspect.value = arVideoEl.videoWidth / arVideoEl.videoHeight;
          }
        }, { once: true });

        state.arMode = true;
        arToggleBtn.classList.add('active');
        arToggleBtn.textContent = '沉浸模式';
        return true;
      } catch (err) {
        console.warn('摄像头权限被拒或不可用:', err);
        showToast('未获取到摄像头权限，已保留沉浸模式');
        return false;
      }
    }

    function disableARMode() {
      state.arMode = false;
      if (state.arStream) {
        state.arStream.getTracks().forEach(t => t.stop());
        state.arStream = null;
      }
      arVideoEl.srcObject = null;
      arToggleBtn.classList.remove('active');
      arToggleBtn.textContent = 'AR 实景';
    }

    arToggleBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (state.arMode) {
        disableARMode();
      } else {
        await enableARMode();
      }
    });

    // =========================================================================
    // 网页内录制视频（canvas.captureStream + MediaRecorder）
    // =========================================================================
    function pickSupportedMime() {
      if (typeof MediaRecorder === 'undefined') return null;
      const candidates = [
        { mime: 'video/mp4;codecs=avc1.42E01E', ext: 'mp4' },
        { mime: 'video/mp4;codecs=avc1', ext: 'mp4' },
        { mime: 'video/mp4', ext: 'mp4' },
        { mime: 'video/webm;codecs=vp9', ext: 'webm' },
        { mime: 'video/webm;codecs=vp8', ext: 'webm' },
        { mime: 'video/webm', ext: 'webm' }
      ];
      for (const c of candidates) {
        if (MediaRecorder.isTypeSupported(c.mime)) return c;
      }
      return { mime: '', ext: 'webm' };
    }

    function formatTimer(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(Math.floor(sec % 60)).padStart(2, '0');
      return `${m}:${s}`;
    }

    function startRecording() {
      const canvas = renderer?.domElement;
      if (!canvas || typeof canvas.captureStream !== 'function' || typeof MediaRecorder === 'undefined') {
        showToast('当前浏览器不支持网页内录制，请改用 iOS 系统屏幕录制', 4500);
        return;
      }

      const fmt = pickSupportedMime();
      if (!fmt) {
        showToast('当前浏览器不支持视频编码录制，请改用 iOS 系统屏幕录制', 4500);
        return;
      }

      try {
        const stream = canvas.captureStream(30);
        const options = fmt.mime ? { mimeType: fmt.mime, videoBitsPerSecond: 4_500_000 } : {};
        const recorder = new MediaRecorder(stream, options);

        state.recordedChunks = [];
        state.lastVideoExt = fmt.ext;

        recorder.ondataavailable = (ev) => {
          if (ev.data && ev.data.size > 0) state.recordedChunks.push(ev.data);
        };

        recorder.onstop = () => {
          clearInterval(state.recTimerId);
          state.isRecording = false;
          recBtn.classList.remove('recording');
          recLabel.textContent = '录制';

          if (state.recordedChunks.length === 0) {
            showToast('未录制到有效画面');
            return;
          }

          const blobType = fmt.mime || (fmt.ext === 'mp4' ? 'video/mp4' : 'video/webm');
          const blob = new Blob(state.recordedChunks, { type: blobType });
          if (state.lastVideoUrl) URL.revokeObjectURL(state.lastVideoUrl);
          const url = URL.createObjectURL(blob);
          state.lastVideoBlob = blob;
          state.lastVideoUrl = url;

          recordedPreview.src = url;
          downloadVideoBtn.href = url;
          downloadVideoBtn.download = `walk-into-memory-${Date.now()}.${fmt.ext}`;

          if (navigator.canShare) {
            const testFile = new File([blob], `walk-into-memory.${fmt.ext}`, { type: blobType });
            shareVideoBtn.style.display = navigator.canShare({ files: [testFile] }) ? 'inline-flex' : 'none';
          } else {
            shareVideoBtn.style.display = 'none';
          }
          videoModal.classList.add('visible');
        };

        recorder.start(250);
        state.mediaRecorder = recorder;
        state.isRecording = true;
        state.recStartTime = Date.now();
        recBtn.classList.add('recording');
        recLabel.textContent = '00:00';
        state.recTimerId = setInterval(() => {
          recLabel.textContent = formatTimer((Date.now() - state.recStartTime) / 1000);
        }, 500);
      } catch (err) {
        console.warn('录制启动失败:', err);
        showToast('网页录制启动失败，请改用 iOS 系统屏幕录制', 4500);
      }
    }

    function stopRecording() {
      if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
        try { state.mediaRecorder.requestData?.(); } catch {}
        state.mediaRecorder.stop();
      }
    }

    recBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.isRecording) stopRecording();
      else startRecording();
    });

    shareVideoBtn.addEventListener('click', async () => {
      if (!state.lastVideoBlob) return;
      try {
        const file = new File([state.lastVideoBlob], `walk-into-memory.${state.lastVideoExt}`, {
          type: state.lastVideoBlob.type
        });
        await navigator.share({ files: [file], title: '回到照片里，再看一次' });
      } catch {}
    });

    closeModalBtn.addEventListener('click', () => {
      recordedPreview.pause();
      videoModal.classList.remove('visible');
    });

    // =========================================================================
    // 主渲染循环
    // =========================================================================
    function startLoop() {
      if (animFrameId) cancelAnimationFrame(animFrameId);
      clock.start();

      function tick() {
        animFrameId = requestAnimationFrame(tick);
        if (!state.inScene || !renderer) return;

        const dt = Math.min(clock.getDelta(), 0.15);
        const elapsed = clock.elapsedTime;

        // 前进 / 回退
        if (state.isHoldingForward && !state.isHoldingRetreat) {
          state.walkProgress = Math.min(1, state.walkProgress + CONFIG.WALK_FORWARD_SPEED * dt);
        } else if (state.isHoldingRetreat) {
          state.walkProgress = Math.max(0, state.walkProgress - CONFIG.WALK_RETREAT_SPEED * dt);
        }

        state.smoothProgress = THREE.MathUtils.lerp(state.smoothProgress, state.walkProgress, 1 - Math.exp(-6.0 * dt));

        // 相机 Z 推进 + 待机呼吸式微幅浮动
        const baseZ = THREE.MathUtils.lerp(state.startZ, state.endZ, state.smoothProgress);
        const breathX = Math.sin(elapsed * 0.45) * 0.018;
        const breathY = Math.sin(elapsed * 0.35 + 1.1) * 0.014;
        const breathZ = Math.sin(elapsed * 0.28 + 2.2) * 0.012;
        camera.position.set(breathX, breathY, baseZ + breathZ);

        // 平滑视角
        state.currentYaw = THREE.MathUtils.lerp(state.currentYaw, state.targetYaw, 1 - Math.exp(-8.0 * dt));
        state.currentPitch = THREE.MathUtils.lerp(state.currentPitch, state.targetPitch, 1 - Math.exp(-8.0 * dt));
        camera.rotation.order = 'YXZ';
        camera.rotation.y = state.currentYaw;
        camera.rotation.x = state.currentPitch;

        // 靠近消散组合：透明度下降 + 高斯膨胀变疏 + 光尘粒子向上飘散
        const dissolve = THREE.MathUtils.smoothstep(state.smoothProgress, 0.08, 0.94);
        if (splatMesh) {
          splatMesh.opacity = 1.0 - THREE.MathUtils.smoothstep(state.smoothProgress, 0.12, 0.88);
          splatMesh.scale.setScalar(1.0 + Math.pow(dissolve, 1.25) * 0.85);
        }
        if (dustUniforms) {
          dustUniforms.uTime.value = elapsed;
          dustUniforms.uDissolve.value = dissolve;
        }

        // HUD 状态联动
        retreatBtn.classList.toggle('visible', state.smoothProgress > 0.04);
        endMessageEl.classList.toggle('visible', state.smoothProgress >= CONFIG.END_MESSAGE_THRESHOLD);

        // 单画布合成渲染（AR 模式下先画摄像头纹理，再清深度画泼溅与光尘）
        renderer.clear();
        if (state.arMode && arVideoEl.readyState >= 2) {
          if (arVideoEl.videoWidth > 0 && bgUniforms) {
            bgUniforms.uVideoAspect.value = arVideoEl.videoWidth / arVideoEl.videoHeight;
          }
          renderer.render(bgScene, bgCamera);
          renderer.clearDepth();
        }
        renderer.render(scene, camera);
      }

      tick();
    }

    // =========================================================================
    // 进入场景入口
    // =========================================================================
    async function enterSceneWithSource(source) {
      // 用户手势内优先同步请求陀螺仪权限
      const gyroOk = await requestGyroSynchronously();

      loadingOverlay.classList.add('visible');
      loadingText.textContent = `正在加载 ${source.name || '回忆场景'}…`;

      try {
        initRendererAndScenes();

        if (splatMesh) {
          scene.remove(splatMesh);
          splatMesh.dispose?.();
          splatMesh = null;
        }

        const srcName = source.name || 'scene.splat';
        const srcExt = srcName.split('.').pop().toLowerCase();
        const meshOpts = source.fileBytes
          ? { fileBytes: source.fileBytes, fileName: srcName, fileType: srcExt }
          : { url: source.url };

        splatMesh = new SplatMesh(meshOpts);

        // 若用户直接选了 splats/ 里的原始 .ply（OpenCV y-down），自动绕 X 轴翻转 180°；
        // splats_mobile/ 里的 .splat 已在生成端完成翻转，保持 0。
        const isRawPly = (source.name || '').toLowerCase().endsWith('.ply');
        if (isRawPly) {
          splatMesh.rotation.x = Math.PI;
        }

        scene.add(splatMesh);
        if (splatMesh.initialized) {
          await splatMesh.initialized;
        }

        // 根据包围盒自适应设置起点与最大推进终点，起点贴合原始相机原点，终点不穿模到漆黑
        let center = new THREE.Vector3(0, 0.4, -2.6);
        let radius = 2.4;
        state.startZ = CONFIG.DEFAULT_START_Z;
        state.endZ = CONFIG.DEFAULT_END_Z;
        try {
          const box = splatMesh.getBoundingBox?.();
          if (box && !box.isEmpty()) {
            box.getCenter(center);
            const size = new THREE.Vector3();
            box.getSize(size);
            radius = Math.max(1.8, Math.min(3.5, size.length() * 0.25));
            // 保持起点在原始摄影机位置 (0, 0, 0) 附近，推进上限控制在场景前半段内部
            state.startZ = CONFIG.DEFAULT_START_Z;
            state.endZ = THREE.MathUtils.clamp(center.z * 0.48, -3.2, -1.6);
          }
        } catch {}

        const dustCenter = new THREE.Vector3(0, THREE.MathUtils.clamp(center.y * 0.35, -0.5, 0.8), (state.startZ + state.endZ) * 0.65);
        state.sceneCenter.copy(center);
        buildLightDustLayer(dustCenter, radius);

        state.walkProgress = 0;
        state.smoothProgress = 0;
        state.targetYaw = 0;
        state.targetPitch = 0;
        state.currentYaw = 0;
        state.currentPitch = 0;
        state.inScene = true;

        if (gyroOk) {
          enableGyro();
        } else {
          disableGyro();
          showToast('未获取到陀螺仪权限，已切换为手指/鼠标拖动环视');
        }

        loadingOverlay.classList.remove('visible');
        landingEl.classList.add('hidden');
        hudEl.classList.add('visible');

        clearTimeout(state.hintTimer);
        enterHintEl.classList.add('visible');
        state.hintTimer = setTimeout(() => {
          enterHintEl.classList.remove('visible');
        }, CONFIG.ENTER_HINT_DURATION_MS);

        startLoop();
      } catch (err) {
        console.error('加载高斯泼溅失败:', err);
        loadingOverlay.classList.remove('visible');
        showToast('场景加载失败，请检查文件格式或网络连接');
      }
    }

    backBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (state.isRecording) stopRecording();
      disableARMode();
      disableGyro();
      state.inScene = false;
      state.isHoldingForward = false;
      state.isHoldingRetreat = false;
      clearTimeout(state.hintTimer);
      enterHintEl.classList.remove('visible');
      endMessageEl.classList.remove('visible');
      retreatBtn.classList.remove('visible');
      hudEl.classList.remove('visible');
      landingEl.classList.remove('hidden');
    });
  </script>
</body>
</html>
