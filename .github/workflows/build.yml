name: build-ios

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project WalkIntoMemoryIOS.xcodeproj \
            -scheme WalkIntoMemoryIOS

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project WalkIntoMemoryIOS.xcodeproj \
            -scheme WalkIntoMemoryIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP=$(find build -name 'WalkIntoMemoryIOS.app' -type d | head -1)
          echo "App: $APP"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$APP/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 需要相机来把回忆场景放进你所在的房间，并感知你的走动。" "$APP/Info.plist"
          echo "Camera usage description in built app:"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP/Info.plist"
          rm -rf Payload WalkIntoMemoryIOS.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry WalkIntoMemoryIOS.ipa Payload
          ls -lh WalkIntoMemoryIOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WalkIntoMemoryIOS-ipa
          path: WalkIntoMemoryIOS.ipa
          if-no-files-found: error
