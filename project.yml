name: WalkIntoMemoryIOS
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
packages:
  MetalSplatter:
    path: Vendor/MetalSplatter
targets:
  WalkIntoMemoryIOS:
    type: application
    platform: iOS
    sources:
      - WalkIntoMemoryIOS
    info:
      path: WalkIntoMemoryIOS/Info.plist
    dependencies:
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.WalkIntoMemory
        PRODUCT_NAME: WalkIntoMemoryIOS
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: "NO"
